<div class="alert alert-success d-flex justify-content-between align-items-center">
    <div>
        <strong><i class="fas fa-user"></i> {{ user.get_full_name|default:user.username }}</strong>
        {% if students|length > 1 %}
            <form method="get" class="d-inline-block ms-2">
                <select name="student_id" class="form-select form-select-sm d-inline-block w-auto" onchange="this.form.submit()">
                    {% for s in students %}
                    <option value="{{ s.pk }}" {% if s.pk == student.pk %}selected{% endif %}>{{ s.full_name }} - {{ s.current_class.name|default:"-" }}</option>
                    {% endfor %}
                </select>
            </form>
        {% else %}
            - Viewing <strong>{{ student.full_name }}</strong>
        {% endif %}
        <span class="badge bg-info ms-2">{{ student.current_class.name|default:"-" }}</span>
        <span class="badge bg-secondary">{{ student.registration_number }}</span>
    </div>
    <button class="btn btn-sm btn-light" onclick="window.print()"><i class="fas fa-download"></i> PDF</button>
</div>
