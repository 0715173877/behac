{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Delete Assignment</h4>
                </div>
                <div class="card-body">
                    <p>Are you sure you want to delete this assignment?</p>
                    <p><strong>Title:</strong> {{ object.title }}</p>
                    <p><strong>Subject:</strong> {{ object.subject.name }}</p>
                    <p><strong>Class:</strong> {{ object.class_level.name }}</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'academics:assignment_list' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-danger">Yes, Delete</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
