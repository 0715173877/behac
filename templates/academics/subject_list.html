{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="text-success"><i class="fas fa-book"></i> Subjects</h2>
</div>
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped">
                <thead><tr><th>Code</th><th>Name</th><th>Classes</th></tr></thead>
                <tbody>
                    {% for s in subjects %}
                    <tr>
                        <td><strong>{{ s.code }}</strong></td>
                        <td>{{ s.name }}</td>
                        <td>{% for c in s.classes.all %}{{ c.name }}{% if not forloop.last %}, {% endif %}{% endfor %}</td>
                    </tr>
                    {% empty %}<tr><td colspan="3">No subjects configured.</td></tr>{% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
