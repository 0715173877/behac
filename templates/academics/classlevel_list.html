{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="text-success"><i class="fas fa-school"></i> Class Levels</h2>
</div>
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped">
                <thead><tr><th>#</th><th>Name</th><th>Type</th></tr></thead>
                <tbody>
                    {% for c in classlevels %}
                    <tr>
                        <td>{{ c.order }}</td>
                        <td>{{ c.name }}</td>
                        <td>{{ c.get_level_type_display }}</td>
                    </tr>
                    {% empty %}<tr><td colspan="3">No classes configured.</td></tr>{% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
