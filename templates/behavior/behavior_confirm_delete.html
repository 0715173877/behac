{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <div class="page-header">
        <h2><i class="fas fa-trash-alt"></i> Delete Behavior Record</h2>
    </div>
    <div class="card">
        <div class="card-body text-center">
            <p class="lead">Are you sure you want to delete this record?</p>
            <p><strong>{{ record.student.full_name }}</strong> - {{ record.description|truncatewords:20 }}</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger"><i class="fas fa-check"></i> Yes, Delete</button>
                <a href="{% url 'behavior:behavior_list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
