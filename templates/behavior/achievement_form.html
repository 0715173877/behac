{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <div class="page-header">
        <h2><i class="fas fa-trophy"></i> {{ title|default:'Achievement' }}</h2>
    </div>
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-behac"><i class="fas fa-save"></i> Save</button>
                <a href="{% url 'behavior:achievement_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
