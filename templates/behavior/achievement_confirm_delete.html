{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <div class="page-header">
        <h2><i class="fas fa-trash-alt"></i> Delete Achievement</h2>
    </div>
    <div class="card">
        <div class="card-body text-center">
            <p class="lead">Are you sure you want to delete this achievement?</p>
            <p><strong>{{ achievement.title }}</strong> - {{ achievement.student.full_name }}</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger"><i class="fas fa-check"></i> Yes, Delete</button>
                <a href="{% url 'behavior:achievement_list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
