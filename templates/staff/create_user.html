{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <div class="page-header">
        <h2><i class="fas fa-user-plus"></i> Create New User</h2>
        <a href="{% url 'staff:user_list' %}" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Username *</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input type="text" name="first_name" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input type="text" name="last_name" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Password</label>
                        <input type="text" name="password" class="form-control" placeholder="Leave empty for auto-generated">
                        <small class="text-muted">Leave empty for auto-generated password</small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Groups</label>
                        <select name="groups" class="form-select" multiple size="4">
                            {% for g in groups %}
                            <option value="{{ g.id }}">{{ g.name }}</option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">Hold Ctrl/Cmd to select multiple</small>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-behac"><i class="fas fa-save"></i> Create User</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
