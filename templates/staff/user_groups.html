{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <div class="page-header">
        <h2><i class="fas fa-user-shield"></i> Change Groups: {{ target_user.username }}</h2>
        <a href="{% url 'staff:user_list' %}" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Back</a>
    </div>

    <div class="card">
        <div class="card-body">
            <p><strong>User:</strong> {{ target_user.get_full_name|default:target_user.username }} ({{ target_user.email }})</p>
            <form method="post">
                {% csrf_token %}
                <div class="row">
                    {% for g in groups %}
                    <div class="col-md-4 mb-2">
                        <div class="form-check">
                            <input type="checkbox" name="groups" value="{{ g.id }}" id="group_{{ g.id }}" class="form-check-input"
                                {% if g.id in user_group_ids %}checked{% endif %}>
                            <label class="form-check-label" for="group_{{ g.id }}">{{ g.name }}</label>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-behac"><i class="fas fa-save"></i> Update Groups</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
