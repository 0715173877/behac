{% extends "base.html" %}
{% block content %}
<div class="container-fluid">
    <div class="page-header">
        <h2><i class="fas fa-trash"></i> Delete Academic Year</h2>
    </div>
    <div class="card">
        <div class="card-body">
            <p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>
            {% if object.term_set.exists %}
            <div class="alert alert-warning">
                <i class="fas fa-exclamation-triangle"></i> This year has {{ object.term_set.count }} term(s) linked.
                Deleting it will also affect them.
            </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a href="{% url "core:academic_year_list" %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
