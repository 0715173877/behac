{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="text-success"><i class="fas fa-tags"></i> Fee Categories</h2>
    <a href="{% url 'finance:category_create' %}" class="btn btn-success">+ New Category</a>
</div>
<div class="card">
    <div class="card-body">
        <table class="table table-striped">
            <thead>
                <tr><th>Name</th><th>Default Amount</th><th>Recurring</th><th>Actions</th></tr>
            </thead>
            <tbody>
                {% for c in categories %}
                <tr>
                    <td>{{ c.name }}</td>
                    <td>{{ c.default_amount }}</td>
                    <td>{% if c.is_recurring %}<span class="badge bg-info">Monthly</span>{% else %}<span class="badge bg-secondary">One-time</span>{% endif %}</td>
                    <td>
                        <a href="{% url 'finance:category_update' c.pk %}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                        <a href="{% url 'finance:category_delete' c.pk %}" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></a>
                    </td>
                </tr>
                {% empty %}<tr><td colspan="4">No fee categories.</td></tr>{% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
