{% extends 'base.html' %}
{% block content %}
<div class="alert alert-danger">
    <h4>Delete Payment</h4>
    <p>Are you sure you want to delete payment <strong>{{ object.receipt_number }}</strong> for {{ object.student.full_name }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'finance:payment_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
